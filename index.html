<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유아용 동물 카드 짝 맞추기 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts: Jua for kid-friendly font -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #fbcfe8 0%, #bae6fd 100%);
            min-height: 100vh;
            user-select: none;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        /* Bounce animation for success */
        @keyframes bounce-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .animate-bounce-scale {
            animation: bounce-scale 0.5s ease infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 md:p-8">

    <header class="text-center mb-4">
        <h1 class="text-4xl md:text-5xl text-pink-600 drop-shadow-md mb-2">🦁 동물 카드 짝 맞추기 🐶</h1>
        <p class="text-gray-700 text-lg md:text-xl">똑같은 동물 친구들을 찾아주세요!</p>
    </header>

    <div class="flex items-center justify-between w-full max-w-md bg-white/80 backdrop-blur-md rounded-2xl p-4 shadow-lg mb-6">
        <div class="text-xl text-blue-600 font-bold">
            시도: <span id="move-count" class="text-2xl text-blue-800">0</span>번
        </div>
        <div class="text-xl text-pink-600 font-bold">
            성공: <span id="match-count" class="text-2xl text-pink-800">0</span> / 6
        </div>
        <button onclick="startGame()" class="bg-gradient-to-r from-yellow-400 to-orange-400 hover:from-yellow-500 hover:to-orange-500 text-white font-bold px-4 py-2 rounded-xl shadow-md transition transform active:scale-95 text-lg">
            다시하기 🔄
        </button>
    </div>

    <main class="w-full max-w-md flex-grow flex items-center justify-center mb-6">
        <div id="game-board" class="grid grid-cols-3 gap-3 md:gap-4 w-full aspect-[3/4]">
            <!-- Cards will be dynamically inserted here -->
        </div>
    </main>

    <div id="win-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform transition animate-bounce-scale">
            <div class="text-6xl mb-4">🎉🏆🎈</div>
            <h2 class="text-3xl text-pink-600 font-bold mb-2">참 잘했어요!</h2>
            <p id="win-message" class="text-gray-600 text-lg mb-6">모든 동물 친구들을 찾았어요!</p>
            <button onclick="startGame()" class="w-full bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 text-white font-bold py-3 rounded-2xl text-xl shadow-lg transition transform active:scale-95">
                한 번 더 놀기! ✨
            </button>
        </div>
    </div>

    <footer class="text-center text-gray-500 text-sm">
        유아용 눈높이에 맞춘 재미있는 소리와 이모지 게임 🌟
    </footer>

    <script>
        // 동물 이모지 목록 (6쌍 = 총 12장)
        const animals = ['🐶', '🐱', '🐰', '🦁', '🐵', '🐸'];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let isProcessing = false;
        let soundEnabled = false;

        // Tone.js 음향 신디사이저 설정
        const synth = new Tone.Synth().toDestination();

        // 사용자 상호작용으로 오디오 컨텍스트 활성화
        function initAudio() {
            if (!soundEnabled) {
                Tone.start();
                soundEnabled = true;
            }
        }

        // 효과음 재생 함수들
        function playFlipSound() {
            initAudio();
            try {
                synth.triggerAttackRelease('C4', '8n');
            } catch(e) {}
        }

        function playMatchSound() {
            initAudio();
            try {
                const now = Tone.now();
                synth.triggerAttackRelease('E4', '8n', now);
                synth.triggerAttackRelease('G4', '8n', now + 0.1);
                synth.triggerAttackRelease('C5', '4n', now + 0.2);
            } catch(e) {}
        }

        function playWrongSound() {
            initAudio();
            try {
                synth.triggerAttackRelease('G3', '8n');
                setTimeout(() => synth.triggerAttackRelease('E3', '8n'), 100);
            } catch(e) {}
        }

        function playWinSound() {
            initAudio();
            try {
                const now = Tone.now();
                synth.triggerAttackRelease('C4', '8n', now);
                synth.triggerAttackRelease('E4', '8n', now + 0.15);
                synth.triggerAttackRelease('G4', '8n', now + 0.3);
                synth.triggerAttackRelease('C5', '2n', now + 0.45);
            } catch(e) {}
        }

        // 게임 시작 및 초기화
        function startGame() {
            initAudio();
            document.getElementById('win-modal').classList.add('hidden');
            matchedPairs = 0;
            moves = 0;
            flippedCards = [];
            isProcessing = false;
            
            updateStats();

            // 카드 짝 만들기 및 섞기
            let deck = [...animals, ...animals];
            deck.sort(() => Math.random() - 0.5);

            cards = deck.map((emoji, index) => ({
                id: index,
                emoji: emoji,
                isFlipped: false,
                isMatched: false
            }));

            renderBoard();
        }

        // 보드판 렌더링
        function renderBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';

            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'perspective-1000 cursor-pointer w-full h-full';
                cardElement.innerHTML = `
                    <div id="card-${index}" class="relative w-full h-full transform-style-3d rounded-2xl shadow-md ${card.isFlipped || card.isMatched ? 'rotate-y-180' : ''}">
                        <!-- 카드 앞면 (뒷모습 - 물음표 또는 무늬) -->
                        <div class="absolute inset-0 bg-gradient-to-br from-indigo-400 to-purple-500 rounded-2xl flex items-center justify-center backface-hidden border-4 border-white shadow-inner">
                            <span class="text-4xl">🎁</span>
                        </div>
                        <!-- 카드 뒷면 (동물 이모지) -->
                        <div class="absolute inset-0 bg-white rounded-2xl flex items-center justify-center backface-hidden rotate-y-180 border-4 border-pink-300 shadow-inner">
                            <span class="text-5xl">${card.emoji}</span>
                        </div>
                    </div>
                `;
                
                cardElement.addEventListener('click', () => handleCardClick(index));
                board.appendChild(cardElement);
            });
        }

        // 카드 클릭 이벤트 처리
        function handleCardClick(index) {
            if (isProcessing) return;
            const card = cards[index];

            // 이미 뒤집혔거나 맞춘 카드면 무시
            if (card.isFlipped || card.isMatched) return;

            // 카드 뒤집기
            card.isFlipped = true;
            playFlipSound();
            updateCardUI(index);

            flippedCards.push({ index, emoji: card.emoji });

            // 두 장을 모두 뒤집었을 때
            if (flippedCards.length === 2) {
                moves++;
                updateStats();
                isProcessing = true;

                const [first, second] = flippedCards;

                if (first.emoji === second.emoji) {
                    // 짝이 맞았을 때
                    cards[first.index].isMatched = true;
                    cards[second.index].isMatched = true;
                    matchedPairs++;
                    updateStats();
                    playMatchSound();

                    flippedCards = [];
                    isProcessing = false;

                    // 게임 승리 확인
                    if (matchedPairs === animals.length) {
                        setTimeout(handleWin, 500);
                    }
                } else {
                    // 짝이 틀렸을 때
                    playWrongSound();
                    setTimeout(() => {
                        cards[first.index].isFlipped = false;
                        cards[second.index].isFlipped = false;
                        updateCardUI(first.index);
                        updateCardUI(second.index);
                        flippedCards = [];
                        isProcessing = false;
                    }, 800);
                }
            }
        }

        // 개별 카드 UI만 부드럽게 업데이트
        function updateCardUI(index) {
            const cardEl = document.getElementById(`card-${index}`);
            const card = cards[index];
            if (card.isFlipped || card.isMatched) {
                cardEl.classList.add('rotate-y-180');
            } else {
                cardEl.classList.remove('rotate-y-180');
            }
        }

        // 상단 점수판 업데이트
        function updateStats() {
            document.getElementById('move-count').innerText = moves;
            document.getElementById('match-count').innerText = matchedPairs;
        }

        // 승리 처리
        function handleWin() {
            playWinSound();
            document.getElementById('win-message').innerText = `${moves}번 만에 모든 동물 친구들을 찾았어요! 대단해요! 👏`;
            document.getElementById('win-modal').classList.remove('hidden');
        }

        // 페이지 로드 시 게임 자동 시작
        window.onload = function() {
            startGame();
        };
    </script>
</body>
</html>
